name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Browser runtime syntax and invariants
        run: |
          node --check browser/flight-recorder.user.js
          node --check browser/account-bridge.user.js
          node --check browser/edge-bridge/service-worker.js
          node --check browser/edge-bridge/runtime-check.mjs
          node browser/edge-bridge/check.mjs
          node browser/edge-bridge/runtime-check.mjs
      - name: Sign in with ChatGPT bridge syntax
        run: |
          node --check tools/siwc-bridge/bridge.mjs
          node --check tools/siwc-bridge/capability-probe.mjs
          node --check tools/siwc-bridge/bootstrap.mjs
          node --check tools/siwc-bridge/smoke.mjs
          node --check tools/run-desktop.mjs
      - name: Build pinned Sign in with ChatGPT DevKit
        run: |
          node tools/siwc-bridge/bootstrap.mjs
          node tools/siwc-bridge/bootstrap.mjs
      - name: Smoke Sign in with ChatGPT runtime
        run: node tools/siwc-bridge/smoke.mjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Protocol corpus validation
        run: cargo run -p chatarium-recorder -- validate-corpus protocol
      - name: Test
        run: cargo test --workspace

  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign in with ChatGPT bridge syntax
        run: |
          node --check tools/siwc-bridge/bridge.mjs
          node --check tools/siwc-bridge/capability-probe.mjs
          node --check tools/siwc-bridge/bootstrap.mjs
          node --check tools/siwc-bridge/smoke.mjs
          node --check tools/run-desktop.mjs
      - name: Install pnpm fallback harness
        run: npm install --global pnpm@10.18.3
      - name: Build pinned Sign in with ChatGPT DevKit without system npm
        env:
          CHATARIUM_FORCE_PNPM_NPM: "1"
        run: |
          node tools/siwc-bridge/bootstrap.mjs
          node tools/siwc-bridge/bootstrap.mjs
      - name: Smoke Sign in with ChatGPT runtime
        run: node tools/siwc-bridge/smoke.mjs
      - name: Check Linux desktop
        run: cargo check -p chatarium-desktop
      - name: Test Linux desktop
        run: cargo test -p chatarium-desktop
      - name: Test Linux stdio tool safety
        run: cargo test -p chatarium-store tool_stdio_
      - name: Install Linux MCP isolation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux apparmor-profiles apparmor-utils
          # Ubuntu restricts user namespaces for unconfined programs. Grant
          # only bwrap's packaged userns-restrict profile; never disable the
          # host-wide AppArmor restriction or expose host networking.
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Verify actual Linux sandbox readiness without consuming a tool route
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_confined_host_readiness_probe -- --nocapture
      - name: Smoke isolated MCP stdio transport
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_bubblewrap_ -- --nocapture
      - name: Smoke durable sandboxed MCP dispatch and terminal result
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_stdio_dispatch_worker_contract -- --nocapture
      - name: Assert isolated MCP process cannot inspect host files
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_sandbox_denies_host_etc_and_home_paths -- --nocapture
