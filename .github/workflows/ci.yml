name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Browser runtime syntax and invariants
        run: |
          node --check browser/flight-recorder.user.js
          node --check browser/account-bridge.user.js
          node --check browser/edge-bridge/service-worker.js
          node --check browser/edge-bridge/runtime-check.mjs
          node browser/edge-bridge/check.mjs
          node browser/edge-bridge/runtime-check.mjs
      - name: Sign in with ChatGPT bridge syntax
        run: |
          node --check tools/siwc-bridge/bridge.mjs
          node --check tools/siwc-bridge/response-lane.mjs
          node --check tools/siwc-bridge/response-lane.test.mjs
          node --test tools/siwc-bridge/response-lane.test.mjs
          node --check tools/siwc-bridge/retry-policy.mjs
          node --check tools/siwc-bridge/retry-policy.test.mjs
          node --test tools/siwc-bridge/retry-policy.test.mjs
          node --check tools/siwc-bridge/agent-activity.mjs
          node --check tools/siwc-bridge/agent-activity.test.mjs
          node --test tools/siwc-bridge/agent-activity.test.mjs
          node --check tools/siwc-bridge/web-search-evidence.mjs
          node --check tools/siwc-bridge/web-search-evidence.test.mjs
          node --test tools/siwc-bridge/web-search-evidence.test.mjs
          node --check tools/siwc-bridge/test/offline-preload.mjs
          node --check tools/siwc-bridge/test/fake-devkit.mjs
          node --check tools/siwc-bridge/test/alpha-protocol.test.mjs
          node --check tools/siwc-bridge/test/sign-in-preflight.test.mjs
          node --test tools/siwc-bridge/test/sign-in-preflight.test.mjs
          node --test tools/siwc-bridge/test/alpha-protocol.test.mjs
          node --check tools/siwc-bridge/capability-probe.mjs
          node --check tools/siwc-bridge/bootstrap.mjs
          node --check tools/siwc-bridge/smoke.mjs
          node --check tools/run-desktop.mjs
          node --check tools/run-desktop.test.mjs
          node --test tools/run-desktop.test.mjs
          node --check tools/run-openviking-qa.mjs
          node --check tools/run-openviking-qa.test.mjs
          node --test tools/run-openviking-qa.test.mjs
      - name: Fixed localhost MCP HTTP transport tests
        run: |
          node --check tools/local-http-mcp/client.mjs
          node --check tools/local-http-mcp/worker.mjs
          node --test tools/local-http-mcp/client.test.mjs
          node --test tools/local-http-mcp/openviking-live-probe.test.mjs
      - name: Build pinned Sign in with ChatGPT DevKit
        run: |
          node tools/siwc-bridge/bootstrap.mjs
          node tools/siwc-bridge/bootstrap.mjs
      - name: Smoke Sign in with ChatGPT runtime
        run: node tools/siwc-bridge/smoke.mjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Protocol corpus validation
        run: cargo run -p chatarium-recorder -- validate-corpus protocol
      - name: Test
        run: cargo test --workspace

  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign in with ChatGPT bridge syntax
        run: |
          node --check tools/siwc-bridge/bridge.mjs
          node --check tools/siwc-bridge/response-lane.mjs
          node --check tools/siwc-bridge/response-lane.test.mjs
          node --test tools/siwc-bridge/response-lane.test.mjs
          node --check tools/siwc-bridge/retry-policy.mjs
          node --check tools/siwc-bridge/retry-policy.test.mjs
          node --test tools/siwc-bridge/retry-policy.test.mjs
          node --check tools/siwc-bridge/agent-activity.mjs
          node --check tools/siwc-bridge/agent-activity.test.mjs
          node --test tools/siwc-bridge/agent-activity.test.mjs
          node --check tools/siwc-bridge/web-search-evidence.mjs
          node --check tools/siwc-bridge/web-search-evidence.test.mjs
          node --test tools/siwc-bridge/web-search-evidence.test.mjs
          node --check tools/siwc-bridge/test/offline-preload.mjs
          node --check tools/siwc-bridge/test/fake-devkit.mjs
          node --check tools/siwc-bridge/test/alpha-protocol.test.mjs
          node --check tools/siwc-bridge/test/sign-in-preflight.test.mjs
          node --test tools/siwc-bridge/test/sign-in-preflight.test.mjs
          node --test tools/siwc-bridge/test/alpha-protocol.test.mjs
          node --check tools/siwc-bridge/capability-probe.mjs
          node --check tools/siwc-bridge/bootstrap.mjs
          node --check tools/siwc-bridge/smoke.mjs
          node --check tools/run-desktop.mjs
          node --check tools/run-desktop.test.mjs
          node --test tools/run-desktop.test.mjs
          node --check tools/run-openviking-qa.mjs
          node --check tools/run-openviking-qa.test.mjs
          node --test tools/run-openviking-qa.test.mjs
      - name: Fixed localhost MCP HTTP transport tests
        run: |
          node --check tools/local-http-mcp/client.mjs
          node --check tools/local-http-mcp/worker.mjs
          node --test tools/local-http-mcp/client.test.mjs
          node --test tools/local-http-mcp/openviking-live-probe.test.mjs
      - name: Install pnpm fallback harness
        run: npm install --global pnpm@10.18.3
      - name: Build pinned Sign in with ChatGPT DevKit without system npm
        env:
          CHATARIUM_FORCE_PNPM_NPM: "1"
        run: |
          node tools/siwc-bridge/bootstrap.mjs
          node tools/siwc-bridge/bootstrap.mjs
      - name: Smoke Sign in with ChatGPT runtime
        run: node tools/siwc-bridge/smoke.mjs
      - name: Verify desktop alpha launch command selects GUI binary
        run: |
          node -e "const fs=require('node:fs');const p=fs.readFileSync('apps/desktop/Cargo.toml','utf8');const launcher=fs.readFileSync('tools/run-desktop.mjs','utf8');if(!/^default-run = \"chatarium-desktop\"$/m.test(p) || !launcher.includes('['+'\"run\", \"-p\", \"chatarium-desktop\", \"--bin\", \"chatarium-desktop\"'+']'))process.exit(1)"
      - name: Check Linux capture library used by workspace builds
        run: cargo check -p chatarium-capture --lib
      - name: Check Linux desktop
        run: cargo check -p chatarium-desktop
      - name: Check full Linux workspace (matches local cbr build)
        run: cargo check --workspace
      - name: Smoke the actual MCP demo stdio server
        run: |
          cargo build -p chatarium-desktop --bin chatarium-mcp-demo
          python3 tools/qa-mcp-demo/smoke.py target/debug/chatarium-mcp-demo
      - name: Test Linux desktop
        run: cargo test -p chatarium-desktop
      - name: Profile native archive search (synthetic, non-gating)
        run: cargo test -p chatarium-desktop --bin chatarium-desktop native_search_perf_profile -- --ignored --nocapture
      - name: Native conversation-to-tool-to-followup journey
        run: cargo test -p chatarium-desktop --bin chatarium-desktop integration_journey_ -- --nocapture
      - name: Test Linux stdio tool safety
        run: cargo test -p chatarium-store tool_stdio_
      - name: Install Linux MCP isolation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux apparmor-profiles apparmor-utils
          # Ubuntu restricts user namespaces for unconfined programs. Grant
          # only bwrap's packaged userns-restrict profile; never disable the
          # host-wide AppArmor restriction or expose host networking.
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Smoke three demo tools through the production isolated MCP runner
        env:
          CHATARIUM_TEST_LINUX_MCP_DEMO: "1"
        run: |
          cargo build -p chatarium-desktop --bin chatarium-mcp-demo
          sudo install -o root -g root -m 0755 target/debug/chatarium-mcp-demo /usr/bin/chatarium-mcp-demo
          cargo test -p chatarium-desktop --bin chatarium-desktop live_demo_mcp_provider_end_to_end -- --nocapture
      - name: Verify actual Linux sandbox readiness without consuming a tool route
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_confined_host_readiness_probe -- --nocapture
      - name: Verify standalone MCP host-check entry point and JSON contract
        run: |
          cargo run -p chatarium-desktop --bin chatarium-mcp-host-check
          cargo run -p chatarium-desktop --bin chatarium-mcp-host-check -- --json | node -e "const x=JSON.parse(require('fs').readFileSync(0,'utf8')); if(x.schema_version!==1 || x.check!=='fixed_usr_bin_true_sandbox' || x.status!=='ready' || x.failure_category!=='none' || x.detail!==null || x.tool_route_consumed!==false || x.provider_executed!==false || x.journal_accessed!==false || x.host_network_accessed!==false) process.exit(1)"
      - name: Smoke isolated MCP stdio transport
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_bubblewrap_ -- --nocapture
      - name: Smoke durable sandboxed MCP dispatch and terminal result
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_stdio_dispatch_worker_contract -- --nocapture
      - name: Assert isolated MCP process cannot inspect host files
        env:
          CHATARIUM_TEST_LINUX_MCP_SANDBOX: "1"
        run: cargo test -p chatarium-desktop live_sandbox_denies_host_etc_and_home_paths -- --nocapture
