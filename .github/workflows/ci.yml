name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Browser recorder syntax
        run: node --check browser/flight-recorder.user.js
      - name: Sign in with ChatGPT bridge syntax
        run: |
          node --check tools/siwc-bridge/bridge.mjs
          node --check tools/siwc-bridge/bootstrap.mjs
      - name: Build pinned Sign in with ChatGPT DevKit
        run: node tools/siwc-bridge/bootstrap.mjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Protocol corpus validation
        run: cargo run -p chatarium-recorder -- validate-corpus protocol
      - name: Test
        run: cargo test --workspace
