name: native-reader-visual-qa

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/desktop/src/main.rs"
      - "apps/desktop/src/reader_visual_qa.rs"
      - "apps/desktop/src/system_fonts.rs"
      - "apps/desktop/src/virtual_reader.rs"
      - "tools/qa-native-reader/**"
      - ".github/workflows/native-reader-visual-qa.yml"

concurrency:
  group: native-reader-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      CHATARIUM_QA_REQUIRE_NOTO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install disposable X11 and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb openbox xdotool imagemagick python3-pil jq libxkbcommon-x11-0 libegl1 libgl1 fonts-noto-core fonts-noto-cjk
      - name: Verify deterministic Noto fallback fixtures
        run: |
          test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -s /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf
      - name: Build native Chatarium binary
        run: cargo build -p chatarium-desktop --bin chatarium-desktop
      - name: Launch synthetic native reader and capture visual evidence
        run: xvfb-run -a -s "-screen 0 1440x960x24" bash tools/qa-native-reader/run.sh
      - name: Repeat screenshots under non-default X11 pixel scaling
        env:
          WINIT_X11_SCALE_FACTOR: "1.25"
          CHATARIUM_READER_QA_OUTPUT: ".qa-native-reader-hidpi"
        run: xvfb-run -a -s "-screen 0 1920x1200x24" bash tools/qa-native-reader/run.sh
      - name: Upload disposable screenshots and structural results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-reader-visual-qa
          path: |
            .qa-native-reader/*.png
            .qa-native-reader/*.json
            .qa-native-reader/*.log
            .qa-native-reader-hidpi/*.png
            .qa-native-reader-hidpi/*.json
            .qa-native-reader-hidpi/*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
