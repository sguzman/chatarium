[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/protocol",
    "crates/store",
    "tools/importer",
    "tools/recorder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sguzman/chatarium"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
