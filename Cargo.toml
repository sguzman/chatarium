[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/protocol",
    "crates/store",
    "tools/capture",
    "tools/importer",
    "tools/recorder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sguzman/chatarium"

[workspace.lints.rust]
# Keep unsafe code denied by default while allowing the isolated Win32 pipe module to opt in.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
